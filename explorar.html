<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIIN — Explorar Yucatán</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--brown:#67280F;--brown2:#552818;--gold:#EAD9C9;--copper:#B7613E;--cream:#fff9ef}*{box-sizing:border-box}body{margin:0;background:#f4ede5;color:var(--brown2);font-family:'Plus Jakarta Sans',sans-serif}.app{max-width:460px;min-height:100dvh;margin:auto;background:#fff8f1;padding-bottom:95px;box-shadow:0 0 30px #4932211c}header{background:#fff8f1;color:#2b1810;border-bottom:1px solid #eae6df;padding:23px 19px 18px;position:sticky;top:0;z-index:3}header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0;font-weight:800}header p{font-size:12px;color:#786a60;opacity:1;margin:6px 0 0}main{padding:17px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:thin}.tabs button{flex-shrink:0;background:#f4e7d9;border:1px solid #e6d0b8;color:var(--brown);font-weight:700;padding:10px 13px;border-radius:30px;white-space:nowrap}.tabs button.on{background:#2b1810;color:white}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}.card{background:white;border:1px solid #eae6df;border-radius:12px;margin:10px 0;padding:17px;box-shadow:0 4px 15px #5124100b}.card h3{margin:0 0 7px;font-size:17px}.card p{margin:5px 0 12px;color:#72594b;font-size:13px;line-height:1.5}.pill{background:#fdf0d9;color:var(--brown);border-radius:20px;padding:5px 10px;font-weight:700;font-size:11px;display:inline-block;margin-bottom:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--gold);color:#4b200b}.secondary{background:#faf3eb;color:var(--brown)}.field{width:100%;border:1px solid #d6bfae;padding:13px;border-radius:12px;background:white;min-width:0;margin:5px 0 12px}label{font-size:12px;font-weight:800}.empty{background:#f6eadd;padding:20px;border-radius:16px;color:#70513d;font-size:14px}.muted{font-size:12px;color:#816454}.hidden{display:none!important}#sectionTitle{font-size:19px;margin:6px 0 12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #eadccc;z-index:4;padding:11px 5px max(14px,env(safe-area-inset-bottom))}.bottom a{color:var(--brown);font-size:12px;font-weight:800;text-decoration:none;padding:9px 6px}.bottom a.on{background:#fce5b4;border-radius:12px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--brown);color:white;padding:13px 19px;border-radius:12px;z-index:6;width:min(90vw,400px);text-align:center}@media(max-width:360px){main{padding:12px}.card{padding:13px}.bottom a{font-size:11px}}
.bottom{width:min(480px,100vw)!important;max-width:480px!important;left:50%!important;transform:translateX(-50%)!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;align-items:center!important;padding:7px 4px max(8px,env(safe-area-inset-bottom))!important;min-height:64px;box-sizing:border-box}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px!important;min-width:0;text-align:center}.bottom .material-symbols-outlined{font-family:'Material Symbols Outlined'!important;font-size:23px!important;font-weight:normal!important;font-style:normal!important;line-height:1}.app main{padding-bottom:90px!important}html,body{overflow-y:auto!important}
</style><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet"><script>if(!JSON.parse(localStorage.getItem('biin_session')||'null'))location.replace('biin_iniciar_sesi_n/code.html');</script></head><body><div class="app"><header><div class="top"><div><h1>BIIN · Explorar</h1><p>Rutas y experiencias de Yucatán</p></div><button class="secondary" onclick="location.href='biin_rutas_de_transporte_yucat_n/code.html'">Mapa</button></div></header><main><div class="tabs" id="tabs"></div><h2 id="sectionTitle"></h2><div id="content"></div></main><nav class="bottom" aria-label="Navegación principal"><a href="biin_rutas_de_transporte_yucat_n/code.html"><span class="material-symbols-outlined">home</span><span>Inicio</span></a><a href="biin_seleccionar_destino/code.html"><span class="material-symbols-outlined">route</span><span>Rutas</span></a><a href="explorar.html" class="on"><span class="material-symbols-outlined">explore</span><span>Explorar</span></a><a href="#" id="explore-trips"><span class="material-symbols-outlined">event_note</span><span>Mi viaje</span></a><a href="biin_mi_perfil_de_usuario/code.html"><span class="material-symbols-outlined">person</span><span>Perfil</span></a></nav></div><script>
const key=k=>{let u;try{u=JSON.parse(localStorage.getItem('biin_session'))}catch{}return ['plans','savedRoutes','favorites','completedTrips','visitedTowns'].includes(k)?'biin_user_'+encodeURIComponent((u?.email||'').toLowerCase())+'_'+k:'biin_'+k};const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(key(k)))??d}catch{return d}},set=(k,v)=>localStorage.setItem(key(k),JSON.stringify(v));if(!get('session',null))location.replace('biin_iniciar_sesi_n/code.html');
const sections=[['sitios','Sitios y atractivos'],['recorridos','Recorridos sugeridos'],['intereses','Por interés'],['eventos','Eventos'],['sabores','Sabores locales'],['favoritos','Favoritos'],['plan','Mi plan']];
const data={sitios:[['Centro histórico de Izamal','Arquitectura y paseos en el Pueblo Mágico','Izamal','Patrimonio'],['Cenotes de Homún','Experiencias naturales y cenotes','Homún','Naturaleza'],['Centro histórico de Valladolid','Calles y arquitectura tradicional','Valladolid','Cultura'],['Mercado local de Tekit','Conoce la actividad local','Tekit','Cultura']],recorridos:[['Ruta cultural de Izamal','Centro histórico, plazas y gastronomía','Izamal','Cultural'],['Naturaleza en Homún','Recorrido por cenotes y comunidad','Homún','Naturaleza'],['Paseo por Valladolid','Patrimonio y sitios emblemáticos','Valladolid','Cultural']],eventos:[['Agenda cultural de Izamal','Evento de ejemplo · fecha por confirmar','Izamal','Cultura'],['Actividades comunitarias','Evento de ejemplo · sujeto a disponibilidad','Valladolid','Comunidad']],sabores:[['Cocina tradicional de Izamal','Gastronomía local · negocio ilustrativo','Izamal','Comida yucateca'],['Mercados de Valladolid','Sabores tradicionales · información ilustrativa','Valladolid','Mercado'],['Gastronomía de Homún','Platillos de la región · información ilustrativa','Homún','Comida yucateca']]};
let section=location.hash.replace('#','')||'sitios',filter='',query='';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2400)}
function save(item){let a=get('xpFavorites',[]),id=item.join('|');if(a.some(x=>x.join('|')===id)){a=a.filter(x=>x.join('|')!==id);toast('Quitado de favoritos')}else{a.push(item);toast('Guardado en favoritos')}set('xpFavorites',a);render()}
function addPlan(item){let a=get('xpPlan',[]);if(a.some(x=>x.join('|')===item.join('|'))){toast('Actividad ya añadida');return}a.push(item);set('xpPlan',a);toast('Actividad añadida a Mi plan');render()}
function card(item,i){return `<article class="card"><span class="pill">${safe(item[3])} · ${safe(item[2])}</span><h3>${safe(item[0])}</h3><p>${safe(item[1])}</p><div class="actions"><button class="secondary" data-act="fav" data-index="${i}">☆ Guardar</button><button class="primary" data-act="plan" data-index="${i}">+ Mi plan</button><button class="secondary" data-act="route" data-index="${i}">Ver ruta</button></div></article>`}
function render(){if(!sections.some(x=>x[0]===section))section='sitios';document.getElementById('tabs').innerHTML=sections.map(([id,t])=>`<button data-tab="${id}" class="${id===section?'on':''}">${t}</button>`).join('');document.getElementById('sectionTitle').textContent=sections.find(x=>x[0]===section)[1];let list=section==='favoritos'?get('xpFavorites',[]):section==='plan'?get('xpPlan',[]):section==='intereses'?[...data.sitios,...data.recorridos]:data[section]||[];if(section==='intereses'&&filter)list=list.filter(x=>x[3]===filter);if(query)list=list.filter(x=>x.join(' ').toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));window.currentList=list;let ui='';if(['sitios','recorridos','intereses','eventos','sabores'].includes(section))ui+=`<label for="q">Buscar por nombre o localidad</label><input class="field" id="q" placeholder="Buscar en Yucatán" value="${safe(query)}">`;if(section==='intereses')ui+=`<label for="filter">Tipo de experiencia</label><select id="filter" class="field"><option value="">Todos</option>${['Cultura','Patrimonio','Naturaleza','Cultural'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select>`;if(section==='plan')ui+=`<div class="card"><h3>Organiza tu viaje</h3><label>Nombre del itinerario<input class="field" id="planName" value="${safe(get('planName','Mi viaje por Yucatán'))}" required></label><label>Fecha del viaje<input class="field" type="date" id="planDate" value="${safe(get('planDate',''))}"></label><button class="primary" id="savePlan">Guardar itinerario</button><p class="muted">Añade actividades desde Sitios, Recorridos o Sabores.</p></div>`;if(!list.length)ui+='<div class="empty">No hay resultados. Prueba con otra búsqueda o agrega elementos desde Explorar.</div>';else ui+=list.map(card).join('');if(section==='plan'&&list.length)ui+='<button id="clearPlan" class="secondary">Vaciar itinerario</button>';document.getElementById('content').innerHTML=ui;document.getElementById('q')?.addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('q');inp.focus();inp.setSelectionRange(pos,pos)});document.getElementById('filter')?.addEventListener('change',e=>{filter=e.target.value;render()});document.getElementById('savePlan')?.addEventListener('click',()=>{let n=document.getElementById('planName').value.trim(),d=document.getElementById('planDate').value;if(!n||!d){toast('Escribe nombre y fecha del viaje');return}set('planName',n);set('planDate',d);toast('Itinerario guardado en este dispositivo')});document.getElementById('clearPlan')?.addEventListener('click',()=>{set('xpPlan',[]);render()})}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){section=tab.dataset.tab;query='';location.hash=section;render();return}let b=e.target.closest('[data-act]');if(!b)return;let item=window.currentList[Number(b.dataset.index)];if(!item)return;if(b.dataset.act==='fav')save(item);if(b.dataset.act==='plan')addPlan(item);if(b.dataset.act==='route'){let names=['Izamal','Valladolid','Tekit','Homún','Ticul'],slug=['izamal','valladolid','tekit','hom_n','ticul'],idx=names.indexOf(item[2]);if(idx<0){toast('No se encontró una ruta de ejemplo');return}set('selectedDestination',idx);location.href='biin_detalle_de_ruta_'+slug[idx]+'/code.html'}});addEventListener('hashchange',()=>{section=location.hash.slice(1)||'sitios';render()});render();
</script><script>document.getElementById('explore-trips')?.addEventListener('click',function(e){e.preventDefault();const plans=(()=>{try{const u=JSON.parse(localStorage.getItem('biin_session'));return JSON.parse(localStorage.getItem('biin_user_'+encodeURIComponent(u.email.toLowerCase())+'_plans'))||[]}catch{return []}})();if(!plans.length){alert('Todavía no tienes itinerarios guardados. Selecciona una ruta para crear uno.');return}location.href='biin_mi_itinerario_en_'+(['izamal','valladolid','tekit','hom_n','ticul'][plans[0].dest]||'izamal')+'/code.html'});</script></body></html>
