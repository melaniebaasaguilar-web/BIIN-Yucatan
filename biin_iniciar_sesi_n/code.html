<!-- Top Navigation & Action Controls -->
<div class="flex items-center justify-between py-space-md">
<button aria-label="Regresar" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low text-on-surface transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-headline-sm">arrow_back</span>
</button>
<div class="flex items-center gap-space-xs px-3 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md">
<span class="w-2 h-2 rounded-full bg-secondary"></span>

</div>
</div>
<!-- Brand Presence & Header Block -->
<div class="flex flex-col items-start mt-space-sm mb-space-lg">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-space-xs">
      Bienvenido a BIIN
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      Tu movilidad y rutas intermunicipales de Yucatán en un solo lugar.
    </p>
</div>
<!-- Switch Tabs: Iniciar Sesión / Registrarme -->
<div class="flex p-1 rounded-lg bg-surface-container mb-space-lg">
<button class="flex-1 py-2.5 rounded-md bg-surface text-primary font-label-lg text-label-lg shadow-sm text-center transition-all" id="tab-login" type="button">
      Iniciar Sesión
    </button>
<button class="flex-1 py-2.5 rounded-md text-on-surface-variant font-label-lg text-label-lg text-center transition-all hover:text-on-surface" id="tab-register" type="button">
      Registrarme
    </button>
</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Identifier Input (Email or Mobile) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium flex items-center justify-between" for="identifier">
<span class="">Correo electrónico o Celular</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Requerido</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-headline-sm pointer-events-none">
          person
        </span>
<input class="w-full h-13 pl-11 pr-4 bg-surface-container-low text-primary font-body-md text-body-md rounded-lg placeholder:text-outline focus:bg-surface focus:outline-none transition-colors" id="identifier" placeholder="ej. melanie@correo.com o 999 123 4567" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password">
          Contraseña
        </label>
<button class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-fixed transition-colors font-semibold" type="button">
          ¿Olvidaste tu contraseña?
        </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-headline-sm pointer-events-none">
          lock
        </span>
<input class="w-full h-13 pl-11 pr-16 bg-surface-container-low text-primary font-body-md text-body-md rounded-lg placeholder:text-outline focus:bg-surface focus:outline-none transition-colors" id="password" placeholder="••••••••••••" type="password">
<button class="absolute right-3 px-2 py-1 font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" id="togglePassword" type="button">
<span id="toggleText" class="">Mostrar</span>
</button>
</div>
</div>
<!-- Main Submit Action Button -->
<button class="mt-space-xs w-full h-12 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm transition-transform active:scale-[0.99] hover:opacity-95" type="submit">
<span class="">Entrar a mi cuenta</span>
<span class="material-symbols-outlined text-body-lg">arrow_forward</span>
</button>
</form>
<!-- Clear Minimalist Divider -->
<div class="flex items-center gap-space-md my-space-lg">
<div class="flex-1 h-px bg-surface-variant"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">o continúa con</span>
<div class="flex-1 h-px bg-surface-variant"></div>
</div>
<!-- Express Access Options -->
<div class="flex flex-col gap-space-sm">
<!-- Google Single Sign-On -->
<button class="w-full h-12 rounded-lg bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-3 transition-colors active:scale-[0.99]" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.98 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="">Continuar con Google</span>
</button>
<!-- Va y Ven / BIIN NFC Physical Card Auth -->

</div>
<!-- Institutional Trust & Security Guarantee -->
<div class="mt-space-xl p-space-md rounded-xl bg-surface-container-low flex items-start gap-space-sm">
<span class="material-symbols-outlined text-secondary text-headline-sm shrink-0 mt-0.5">verified_user</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-primary font-semibold">Seguridad Verificada</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
        Tus datos están protegidos con cifrado de grado bancario por el Sistema de Movilidad de Yucatán.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const toggleText = document.getElementById('toggleText');

    if (toggleBtn && passwordInput && toggleText) {
      toggleBtn.addEventListener('click', function() {
        const isHidden = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
        toggleText.textContent = isHidden ? 'Ocultar' : 'Mostrar';
      });
    }

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');

    if (tabLogin && tabRegister) {
      tabRegister.addEventListener('click', function() {
        tabRegister.className = 'flex-1 py-2.5 rounded-md bg-surface text-primary font-label-lg text-label-lg shadow-sm text-center transition-all';
        tabLogin.className = 'flex-1 py-2.5 rounded-md text-on-surface-variant font-label-lg text-label-lg text-center transition-all hover:text-on-surface';
      });

      tabLogin.addEventListener('click', function() {
        tabLogin.className = 'flex-1 py-2.5 rounded-md bg-surface text-primary font-label-lg text-label-lg shadow-sm text-center transition-all';
        tabRegister.className = 'flex-1 py-2.5 rounded-md text-on-surface-variant font-label-lg text-label-lg text-center transition-all hover:text-on-surface';
      });
    }
  })();
</script></main>

<script src="../biin-interaction.js" defer></script></body></html>
